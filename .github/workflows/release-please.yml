---
name: Release Please

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
    uses: dryvist/.github/.github/workflows/_release-please.yml@26e6933fbebcf11bfbe6d675f9ce7b322ffd7de9 # v1.17.0
    secrets:
      GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY: ${{ secrets.GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY }}

  # Releases are immutable once published, so release-please creates a draft
  # (release-please-config.json) and the site tarball plus its sha256 are
  # attached here before publishing. The wall role downloads both.
  assets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: node scripts/vendor-three.mjs
      - run: node scripts/gen-queries.mjs
      - id: tag
        run: echo "tag=v$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - run: tar -czf homelab-wall-site.tar.gz -C site .
      - run: sha256sum homelab-wall-site.tar.gz > homelab-wall-site.tar.gz.sha256
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release upload "$TAG" homelab-wall-site.tar.gz homelab-wall-site.tar.gz.sha256 --clobber

  publish:
    needs: assets
    uses: dryvist/.github/.github/workflows/_publish-draft-release.yml@f9e8814ad8f82e4bc8cdaac73ee49b1ffa6d4cf2 # v1.12.1
    with:
      tag: ${{ needs.assets.outputs.tag }}
      latest: true
    secrets:
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
