name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: node scripts/vendor-three.mjs
      - run: node scripts/gen-queries.mjs
      # Fails if site/lib/queries.js changed without regenerating the committed site/queries.json
      # allow-list — the one source snapshot lookups (site/lib/prom.js) and the publisher read.
      - run: git diff --exit-code -- site/queries.json
      - run: npx tsc --noEmit
      - run: node --test 'tests/*.test.js' 'tests/*.test.mjs'

  # One job per Playwright project instead of one job running all 8: the full matrix on a single
  # 4-vCPU runner over-subscribed it (WebGL/bloom scenes plus screenshot capture across 8
  # projects), which surfaced as screenshot-capture failures and skewed the fake-clock/postMessage
  # timing rotator.spec depends on — both CI-only, never reproducing in a low-parallelism local
  # run. Sharding by project keeps each runner's load light and the wall-clock time down, since
  # shards run on separate runners in parallel rather than queueing on one. Each project is also
  # split in three (--shard) so its slowest third still finishes inside the 10-minute job limit.
  test:
    name: Playwright (${{ matrix.project }} ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # Playwright's own image carries the browsers and their system packages, so no step installs
    # them through apt. Its version matches @playwright/test in package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-resolute@sha256:f76885029244e5a384243a930ff283cef67d90653978ee27a77dd4cff8882fb4
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium-1920x1080@1
          - chromium-1920x1080@2
          - webkit-1920x1080@1
          - webkit-1920x1080@2
          - chromium-2560x1440
          - webkit-2560x1440
          - chromium-1440x900
          - webkit-1440x900
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: npm ci
      - run: node scripts/vendor-three.mjs
      # The fixture web server (playwright.config.ts) is python3's http.server.
      - run: python3 --version
      - run: npx playwright test --project="${{ matrix.project }}" --shard=${{ matrix.shard }}/3
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

  # Job id `gate` gives the stable required check `gate / Merge Gate`.
  # The shared workflow cannot see caller jobs, so its Repo Tests command
  # asserts both CI job results. Keep it active on docs-only PRs when either
  # upstream job failed, since the shared workflow otherwise skips that tier.
  gate:
    needs: [typecheck, test]
    if: ${{ always() }}
    permissions:
      actions: write
      contents: read
      pull-requests: read
    uses: JacobPEvans/.github/.github/workflows/_ci-gate.yml@v1
    with:
      production_branch: ${{ needs.typecheck.result == 'success' && needs.test.result == 'success' && 'main' || 'ci-gate-failure' }}
      test_command: ${{ needs.typecheck.result == 'success' && needs.test.result == 'success' && 'true' || 'false' }}
      workflow_lint: true
      zizmor: true
