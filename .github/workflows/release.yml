name: Release

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  release:
    uses: JacobPEvans/.github/.github/workflows/_release.yml@v1
    secrets:
      GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY: ${{ secrets.GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY }}
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      checks: read


  # Releases are immutable once published, so release-please creates a draft
  # (release-please-config.json) and the site tarball plus its sha256 are
  # attached here before publishing. The wall role downloads both.
  assets:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: node scripts/vendor-three.mjs
      - run: node scripts/gen-queries.mjs
      - id: tag
        run: echo "tag=v$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - run: tar -czf homelab-wall-site.tar.gz -C site .
      - run: sha256sum homelab-wall-site.tar.gz > homelab-wall-site.tar.gz.sha256
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release upload "$TAG" homelab-wall-site.tar.gz homelab-wall-site.tar.gz.sha256 --clobber


  publish:
    needs: assets
    uses: JacobPEvans/.github/.github/workflows/_publish-draft-release.yml@v1
    with:
      tag: ${{ needs.assets.outputs.tag }}
      latest: true
    secrets:
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
