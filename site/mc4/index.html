<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mission Control — Media</title>
<link rel="stylesheet" href="/lib/wall.css">
<link rel="stylesheet" href="/mc4/mc4.css">
</head>
<body>
<div id="stage" class="stage mc4">
  <!-- Full-viewport hero layer: NOT nested inside a panel (a `contain`/`transform`/`filter`/
       `backdrop-filter` ancestor would become the containing block for this canvas's
       position:fixed, clipping it back to that panel's box) — see the shock-and-awe comment
       block in mc4.css. -->
  <canvas id="corecanvas"></canvas>
  <header>
    <div class="brand"><span id="title">HOMELAB</span> <span class="acc">//</span> MEDIA <span class="acc">//</span> ACQUISITION</div>
    <div class="vpn"><b id="vpn"></b><small id="vpnDetail"></small></div>
    <section class="appstrip" id="apps" data-panel="apps" data-state="pending"><h2>Service health <span id="appsum"></span></h2></section>
    <div class="clock num" id="clock">--:--:--<small>--</small></div>
  </header>

  <!-- Floating glass cards (sketch scene 125's mdL/mdR), not an opaque full-height column: the
       hero canvas's tube/core/disk must show through the gaps between cards and behind them. -->
  <section class="hero-col colL" id="acq" data-panel="acquisition" data-state="pending">
    <div class="cardbody" id="acqbody"></div>
  </section>

  <!-- No title here: the sketch's own scene 125 has no on-canvas label. -->
  <section class="panel panel-frameless" id="core" data-panel="core" data-state="ok"></section>

  <section class="hero-col colR" id="pipe" data-panel="pipeline" data-state="pending">
    <div class="cardbody" id="pipebody"></div>
  </section>

  <div class="posters" id="posters"></div>
</div>
<script type="importmap">{"imports": {"three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three/addons/"}}</script>
<script type="module" src="/mc4/mc4.js"></script>
</body>
</html>
