<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mission Control · Edge</title>
<link rel="stylesheet" href="/lib/wall.css">
<link rel="stylesheet" href="/mc2/mc2.css">
</head>
<body>
<div id="stage" class="mc2stage">
  <header>
    <div class="brand"><span id="title">HOMELAB</span> <span style="color:var(--red)">//</span> EDGE THREAT MAP</div>
    <section class="appstrip" id="apps" data-panel="apps" data-state="pending"><h2>Service health <span id="appsum">—</span></h2></section>
    <div class="clock num" id="clock">--:--:--<small>--</small></div>
  </header>

  <section class="panel" id="threat" data-panel="threat" data-state="pending">
    <h2>Edge <span style="color:var(--red)">//</span> block telemetry<span data-panel-message></span></h2>
    <canvas id="globe"></canvas>
    <div class="stat" id="tstats">
      <div>Blocked today<b>PENDING</b></div>
      <div>Unique sources<b>PENDING</b></div>
      <div>Top sources<b>PENDING</b></div>
    </div>
  </section>
</div>
<script type="importmap">{"imports": {"three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three/addons/"}}</script>
<script type="module" src="/mc2/mc2.js"></script>
</body>
</html>
