<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mission Control</title>
<link rel="stylesheet" href="/lib/wall.css">
<link rel="stylesheet" href="/mc1/mc1.css">
</head>
<body>
<div id="stage" class="stage">
  <header>
    <canvas id="estateRing" width="128" height="128"></canvas>
    <div class="brand"><span id="title">HOMELAB</span> <span style="color:var(--cyan)">//</span> MISSION CONTROL<small id="subtitle">—</small></div>
    <div class="kpis" id="kpis"></div>
    <div class="clock num" id="clock">--:--:--<small>--</small></div>
  </header>

  <section class="panel" id="nodes" data-panel="nodes" data-state="pending"><h2>Nodes <span id="quorum">—</span><span data-panel-message></span></h2><div class="list" id="nodelist"></div></section>

  <section class="panel" id="topo" data-panel="topology" data-state="pending">
    <h2>Network fabric · topology <span id="topostate">LIVE</span><span data-panel-message></span></h2>
    <canvas id="gl"></canvas>
    <div id="labels"></div>
    <div class="ovl" id="wan"></div>
    <div class="ovl" id="vlans"></div>
    <div class="ovl" id="fstats"></div>
  </section>

  <section class="panel" id="apps" data-panel="apps" data-state="pending"><h2>Service health <span id="appsum">—</span><span data-panel-message></span></h2><canvas id="hex"></canvas></section>

  <section class="panel" id="storage" data-panel="storage" data-state="pending"><h2>Storage <span id="sttot">—</span><span data-panel-message></span></h2><div class="rows" id="strows"></div></section>

  <section class="panel" id="fw" data-panel="firewall" data-state="pending"><div class="fwsplit"><span data-panel-message></span>
    <div class="fwcol"><h3 class="bh">⛔ Blocked at the edge <span id="blkrate"></span></h3><div class="fwrows" id="blkrows"></div></div>
    <div class="fwcol"><h3>Live firewall · flows <span id="fwrate"></span></h3><div class="fwrows" id="fwrows"></div></div>
  </div></section>

  <section class="panel" id="llm" data-panel="llm" data-state="pending"><h2>LLM fabric <span id="llmsum">—</span><span data-panel-message></span></h2><div id="llmrows"></div></section>
</div>
<script type="importmap">{"imports": {"three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three/addons/"}}</script>
<script type="module" src="/mc1/mc1.js"></script>
</body>
</html>
